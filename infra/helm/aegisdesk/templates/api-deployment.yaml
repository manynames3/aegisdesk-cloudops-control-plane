{{- if ne (int .Values.api.replicaCount) 1 -}}
{{- fail "The evaluation API uses local SQLite and must have exactly 1 replica. Use an external distributed store before scaling." -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegisdesk.fullname" . }}-api
  labels:
    {{- include "aegisdesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "aegisdesk.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: AEGISDESK_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "api.authSecretName is mandatory" .Values.api.authSecretName | quote }}
                  key: AEGISDESK_AUTH_SECRET
            - name: AEGISDESK_DB_PATH
              value: /app/data/aegisdesk.db
            - name: AEGISDESK_STORE_BACKEND
              value: sqlite
            - name: AEGISDESK_PERSONA_ISSUER_ENABLED
              value: "true"
            - name: AEGISDESK_POLICY_MODE
              value: opa
            - name: OPA_URL
              value: "http://{{ include "aegisdesk.fullname" . }}-opa:8181"
            - name: AEGISDESK_OPA_TIMEOUT_SECONDS
              value: "1.5"
            - name: AEGISDESK_TICKET_ADAPTER
              value: local
            - name: AEGISDESK_INCIDENT_CONTEXT_ADAPTER
              value: local_fixture
            - name: AEGISDESK_ENABLE_BEDROCK
              value: "false"
            - name: AEGISDESK_CLOUD_MODEL_KILL_SWITCH
              value: "true"
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: temp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if .Values.api.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "aegisdesk.fullname" . }}-api-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: temp
          emptyDir: {}
