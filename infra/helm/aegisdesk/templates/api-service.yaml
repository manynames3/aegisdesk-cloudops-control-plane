apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegisdesk.fullname" . }}-api
  labels:
    {{- include "aegisdesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
